name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docker-compose*.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chronos
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: chronos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronos -d chronos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy app/

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://chronos:test_password@localhost:5432/chronos_test
          APP_ENV: testing
          FERNET_KEY: ${{ secrets.FERNET_KEY || 'dGVzdC1rZXktZm9yLXRlc3Rpbmctb25seS11c2Utd2l0aC1mZXJuZXQ=' }}
          JWT_SECRET_KEY: test-secret-key
        run: pytest -v --tb=short
