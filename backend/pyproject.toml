[project]
name = "chronos-agent-backend"
version = "0.1.0"
description = "Local-first multi-user AI calendar agent"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "chronos-agent" }]


dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",


    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",


    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",


    # Security
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "cryptography>=43.0.0",


    # HTTP
    "httpx>=0.27.2",


    # Google Calendar
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.151.0",


    # Agent
    "langgraph>=0.2.50,<1.0.0",
    "langchain-core>=0.3.15,<1.0.0",


    # LLM providers
    "langchain-ollama>=0.2.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0,<4.0.0",
    "psycopg[binary,pool]>=3.2.0",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "types-pyjwt",
]


[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends in defaults


[tool.ruff.lint.isort]
known-first-party = ["app"]


[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"


[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "alembic/*"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["app"]
